name: Cinderella data download

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 pipeline/cinderella_fetch.py
      - name: Save the files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cinderella-model/raw
          git commit -m "Cinderella data download" || echo "nothing new"
          git pull --rebase origin main
          git push
