name: Newsletter refresh

on:
  schedule:
    - cron: "17 * * * *"        # every hour, so a new Substack post shows up on the site soon after it drops
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the newsletter list
        run: python3 pipeline/news_update.py

      - name: Publish if there is a new post
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Newsletter refresh $(date -u +%F)"
            git pull --rebase origin main
            git push
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
          fi
