async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(SALT), iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b(IV)}, key, b(CT)));
  try { sessionStorage.setItem("hz_pw", pw); } catch(e){}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault(); document.getElementById("e").textContent = "";
  const raw = document.getElementById("pw").value;
  // phones capitalise the first letter and add spaces; try the cleaned-up version too
  const tries = [...new Set([raw, raw.trim(), raw.trim().toLowerCase().replace(/\s+/g, "")])];
  for (const t of tries) { try { await unlock(t); return; } catch(err){} }
  document.getElementById("e").textContent = "That password didn't work.";
};
